name: .NET CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: electronics_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d electronics_store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      ELECTRONICS_STORE_TEST_CONNECTION: "Host=localhost;Port=5432;Database=electronics_store_test;Username=postgres;Password=postgres"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ElectronicsStoreApi.slnx

      - name: Build solution
        run: dotnet build ElectronicsStoreApi.slnx --configuration Release --no-restore

      - name: Run all tests
        run: dotnet test ElectronicsStoreApi.slnx --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"